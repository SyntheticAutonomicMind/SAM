name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'project-docs/**'
      - 'scratch/**'
      - 'licenses/**'
      - 'ai-assisted/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'project-docs/**'
      - 'scratch/**'
      - 'licenses/**'
      - 'ai-assisted/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Validate, and Test
    runs-on: [self-hosted]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'
    
    - name: Download Metal Toolchain
      run: |
        echo "Ensuring Metal Toolchain is available for Xcode..."
        TOOLCHAIN_DIR="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain"

        # Check if the default toolchain already has Metal support
        echo "Testing Metal compilation via default toolchain..."
        cat > /tmp/test.metal << 'EOF'
        #include <metal_stdlib>
        using namespace metal;
        kernel void test() {}
        EOF
        DEFAULT_METAL="$TOOLCHAIN_DIR/usr/bin/metal"
        if "$DEFAULT_METAL" -c /tmp/test.metal -o /dev/null 2>&1; then
          echo "Default toolchain Metal compilation test passed!"
          rm -f /tmp/test.metal
        else
          echo "Default toolchain metal proxy cannot find Metal Toolchain."
          echo "Downloading Metal Toolchain component..."
          xcodebuild -downloadComponent MetalToolchain

          # On macOS 26+, the Metal Toolchain is installed as a cryptex
          # at /Library/Developer/Toolchains/Metal.xctoolchain.
          # Try to find a working Metal binary from the installed toolchains.
          REAL_METAL=""
          for candidate in \
            "/Library/Developer/Toolchains/Metal.xctoolchain/usr/bin/metal" \
            "$(xcrun -toolchain Metal --find metal 2>/dev/null)" \
            "$(xcrun -sdk macosx --find metal 2>/dev/null)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" -c /tmp/test.metal -o /dev/null 2>&1; then
              REAL_METAL="$candidate"
              echo "Found working Metal Toolchain: $REAL_METAL"
              break
            fi
          done

          if [ -z "$REAL_METAL" ]; then
            echo "ERROR: Could not find a working Metal Toolchain metal binary"
            exit 1
          fi

          # Install a wrapper at the default toolchain location.
          # macOS 26 may have a read-only system volume; retry without sudo.
          BACKUP="${DEFAULT_METAL}.proxy.backup"
          if sudo cp "$DEFAULT_METAL" "$BACKUP" 2>/dev/null; then
            printf '#!/bin/bash\nexec "%s" "$@"\n' "$REAL_METAL" | sudo tee "$DEFAULT_METAL" > /dev/null
            sudo chmod +x "$DEFAULT_METAL"
          elif cp "$DEFAULT_METAL" "$BACKUP" 2>/dev/null; then
            printf '#!/bin/bash\nexec "%s" "$@"\n' "$REAL_METAL" | tee "$DEFAULT_METAL" > /dev/null
            chmod +x "$DEFAULT_METAL"
          else
            # Last resort: use REAL_METAL directly via symlink in /usr/local/bin
            echo "Cannot write to Xcode toolchain dir; using symlink in /usr/local/bin"
            REAL_METAL_DIR="$(dirname "$REAL_METAL")"
            export PATH="$REAL_METAL_DIR:$PATH"
            echo "Adding $REAL_METAL_DIR to PATH"
          fi

          if "$DEFAULT_METAL" -c /tmp/test.metal -o /dev/null 2>&1; then
            echo "Metal compilation test passed with wrapper!"
          elif command -v metal >/dev/null 2>&1 && metal -c /tmp/test.metal -o /dev/null 2>&1; then
            echo "Metal compilation test passed via PATH!"
          else
            echo "ERROR: Metal compilation still failing after all attempts"
            exit 1
          fi
        fi
        rm -f /tmp/test.metal

    - name: Build SAM (Debug)
      run: make build-debug

    - name: Run unit tests
      run: make test
    
    - name: Verify build artifacts
      run: |
        ls -la .build/Build/Products/Debug/SAM.app
        ls -la .build/Build/Products/Debug/SAM.app/Contents/MacOS/SAM
